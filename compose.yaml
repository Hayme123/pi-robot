services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      secrets:
        - npm_token
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PI_CODING_AGENT_DIR: /workspace/.pi-agent
      PROJECTS_ROOT: /workspace/projects
    volumes:
      - ./projects:/workspace/projects
      - ./.pi-agent:/workspace/.pi-agent
    restart: unless-stopped

  pi:
    build:
      context: .
      secrets:
        - npm_token
    command: ["/app/node_modules/.bin/pi"]
    working_dir: /workspace/projects
    env_file:
      - path: .env
        required: false
    environment:
      PI_CODING_AGENT_DIR: /workspace/.pi-agent
      PROJECTS_ROOT: /workspace/projects
    volumes:
      - ./projects:/workspace/projects
      - ./.pi-agent:/workspace/.pi-agent
    stdin_open: true
    tty: true

secrets:
  npm_token:
    environment: NPM_TOKEN
