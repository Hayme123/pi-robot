<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Request</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

        :root {
            --primary-navy: #091635;
            --secondary-navy: #02173f;
            --text-muted: #777f90;
            --text-label: #586176;
            --border-light: #e6e7ea;
            --input-bg: #fafafa;
            --accent-green: #8dc63f;
            --white: #ffffff;
            --shadow-card: 0px 0px 32px rgba(208, 210, 218, 0.25);
            --shadow-header: 0px 1px 3px rgba(0, 0, 0, 0.1);
            --shadow-nav: 0px 0px 1.8px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--white);
            color: var(--primary-navy);
            line-height: 1.5;
            padding-bottom: 110px; /* Space for navbar */
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 100;
            box-shadow: var(--shadow-header);
        }

        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 17px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 7px;
        }

        .nav-header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
        }

        .nav-header .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            color: var(--primary-navy);
        }

        .nav-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #101828;
        }

        /* Main Content */
        .container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Summary Card */
        .summary-card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 0.5px solid rgba(0, 0, 0, 0.05);
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .summary-card h2 {
            font-size: 16px;
            font-weight: 400;
            color: var(--primary-navy);
            margin-bottom: 20px;
        }

        .summary-card .code-group {
            display: flex;
            flex-direction: column;
        }

        .summary-card .code {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-navy);
            line-height: 32px;
        }

        .summary-card .label {
            font-size: 10px;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .summary-card .logo-decoration {
            position: absolute;
            right: -40px;
            top: -20px;
            width: 144px;
            height: 144px;
            opacity: 1;
            color: var(--accent-green);
        }

        /* Form */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-wrapper label {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-label);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 16px;
        }

        .input-field {
            height: 56px;
            background: var(--input-bg);
            border: 0.5px solid var(--border-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .input-field.white-bg {
            background: var(--white);
            border-width: 1px;
        }

        .input-field input, .input-field select, .input-field textarea {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            width: 100%;
            outline: none;
            color: var(--primary-navy);
        }

        .input-field input::placeholder, .input-field textarea::placeholder {
            color: var(--text-muted);
        }

        .input-field .icon {
            width: 20px;
            height: 20px;
            color: #9ba0ac;
            flex-shrink: 0;
        }

        .input-field.dropdown .icon {
            color: var(--primary-navy);
        }

        .textarea-field {
            height: 80px;
            align-items: flex-start;
            padding-top: 10px;
        }

        /* Button */
        .btn-create {
            height: 42px;
            background: var(--secondary-navy);
            border-radius: 6px;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            margin-top: 16px;
            cursor: pointer;
        }

        .btn-create .icon {
            width: 14px;
            height: 14px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: var(--white);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            box-shadow: var(--shadow-nav);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--primary-navy);
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-item .icon {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 12px;
        }

        /* SVG Sprite Helpers */
        .icon-svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }
    </style>
</head>

    <header class="header">
        <nav class="nav-header">
            <div class="back-btn">
                <svg class="icon-svg"><use xlink:href="#chevron-left"/></svg>
            </div>
            <h1>Create Request</h1>
        </nav>
    </header>

    <main class="container">
        <section class="summary-card">
            <h2>Create New Poster Request</h2>
            <div class="code-group">
                <span class="code">0000</span>
                <span class="label">Store Code</span>
            </div>
            <div class="logo-decoration">
                <svg class="icon-svg"><use xlink:href="#ncompass-logo"/></svg>
            </div>
        </section>

        <section class="form-group">
            <div class="input-row">
                <div class="input-wrapper">
                    <label>Validity Date</label>
                    <div class="input-field">
                        <input type="text" placeholder="mm / dd / yyyy">
                        <div class="icon">
                            <svg class="icon-svg"><use xlink:href="#calendar"/></svg>
                        </div>
                    </div>
                </div>
                <div class="input-wrapper">
                    <label>Week Batch</label>
                    <div class="input-field">
                        <input type="text" value="W19">
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <label>Resolution</label>
                <div class="input-field white-bg dropdown">
                    <select>
                        <option>1080 x 1920</option>
                    </select>
                    <div class="icon">
                        <svg class="icon-svg"><use xlink:href="#chevron-down"/></svg>
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <label>Number of Items</label>
                <div class="input-field">
                    <input type="text" placeholder="Enter quantity">
                </div>
            </div>

            <div class="input-wrapper">
                <label>Notes (Optional)</label>
                <div class="input-field textarea-field">
                    <textarea placeholder="Additional Information"></textarea>
                    <div class="icon" style="align-self: center;">
                        <svg class="icon-svg"><use xlink:href="#microphone"/></svg>
                    </div>
                </div>
            </div>

            <button class="btn-create">
                Create
                <div class="icon">
                    <svg class="icon-svg"><use xlink:href="#plus-circle"/></svg>
                </div>
            </button>
        </section>
    </main>

    <nav class="navbar">
        <a href="#" class="nav-item active">
            <div class="icon">
                <svg class="icon-svg"><use xlink:href="#copy"/></svg>
            </div>
            <span>Requests</span>
        </a>
        <a href="#" class="nav-item">
            <div class="icon">
                <svg class="icon-svg"><use xlink:href="#plus-circle"/></svg>
            </div>
            <span>Create</span>
        </a>
        <a href="#" class="nav-item">
            <div class="icon">
                <svg class="icon-svg"><use xlink:href="#notification"/></svg>
            </div>
            <span>Notifications</span>
        </a>
        <a href="#" class="nav-item">
            <div class="icon">
                <svg class="icon-svg"><use xlink:href="#profile"/></svg>
            </div>
            <span>Profile</span>
        </a>
    </nav>
</body>
</html>
